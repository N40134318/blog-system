name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Dev through VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          port: ${{ secrets.VM_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.VM_FINGERPRINT }}
          proxy_host: ${{ secrets.VPS_HOST }}
          proxy_username: ${{ secrets.VPS_USER }}
          proxy_port: ${{ secrets.VPS_PORT }}
          proxy_key: ${{ secrets.SERVER_SSH_KEY }}
          proxy_fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 20m
          script: |
            set -e

            PROJECT_DIR=/home/character/blog-system
            DEV_COMPOSE=deploy/compose.dev.yml
            PROD_COMPOSE=deploy/compose.prod.yml
            DEV_ENV=deploy/.env.dev
            PROD_ENV=deploy/.env.prod

            compose() {
              if docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              else
                docker-compose "$@"
              fi
            }

            echo "[INFO] enter project dir"
            cd "$PROJECT_DIR"

            echo "[INFO] mark git safe.directory"
            git config --global --add safe.directory "$PROJECT_DIR" || true

            echo "[INFO] pull latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "[INFO] ensure prod is not running"
            if docker ps --format '{{.Names}}' | grep -q '^blog-frontend-prod$'; then
              echo "[WARN] prod is running, skip dev deploy"
              echo "[INFO] stop prod manually before deploying dev"
              exit 0
            fi

            echo "[INFO] stop prod environment if leftover containers exist"
            if [ -f "$PROD_ENV" ]; then
              compose --env-file "$PROD_ENV" -f "$PROD_COMPOSE" down || true
            else
              echo "[INFO] prod env file is absent, skip prod cleanup"
            fi

            echo "[INFO] stop current dev containers before rebuilding"
            compose --env-file "$DEV_ENV" -f "$DEV_COMPOSE" down

            echo "[INFO] rebuild and start dev containers"
            compose --env-file "$DEV_ENV" -f "$DEV_COMPOSE" up -d --build

            echo "[INFO] waiting dev backend health"
            for i in {1..300}; do
              if curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            echo "[INFO] waiting dev frontend"
            for i in {1..90}; do
              if curl -fsSI http://127.0.0.1:3001 >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            echo "[INFO] backend final check"
            curl -fsS http://127.0.0.1:8081/actuator/health

            echo "[INFO] frontend final check"
            curl -fsSI http://127.0.0.1:3001

            echo "[INFO] running containers"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "[INFO] dev deploy success"
